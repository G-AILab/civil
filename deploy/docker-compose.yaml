version: '3.3'

services:
  torchserve:
    image: civil-torchserve:0.25
    container_name: civil-infer
    hostname: civil-infer
    ports:
      - "19012:22"       # SSH
      - "19080:8080"     # REST API
      - "19081:8081"     # Management API
      - "19082:8082"
    volumes:
      - ./model_store:/workspace/model-server/model-store
      - ./Civil:/workspace/Civil
      - ./config/config.properties:/workspace/model-server/config.properties
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]