version: '3.3'

services:
  torchserve:
    image: pytorch/torchserve:0.12.0-gpu
    container_name: torchserve
    hostname: ano-infer
    ports:
      - "19080:8080"  # REST API
      - "19081:8081"  # Management API
      - "19082:8082"  
    volumes:
      - ./model_store:/home/model-server/model-store
      - ./config:/home/model-server/config
    command: >
      torchserve --start
                 --model-store /home/model-server/model-store
                 --ts-config /home/model-server/config/config.properties

